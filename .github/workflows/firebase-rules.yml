name: Firebase rules tests

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "tests/**"
      - "index.html"
      - "scripts/**"
      - "capacitor.config.json"
      - ".github/workflows/firebase-rules.yml"
  push:
    branches:
      - main

concurrency:
  group: firebase-rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Summarize dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=commonjs -e "const a=require('/tmp/npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name + ': severity=' + v.severity + ', direct=' + v.isDirect + ', fix=' + JSON.stringify(v.fixAvailable)); console.log('Totals:', JSON.stringify(a.metadata?.vulnerabilities || {}));"
      - name: Check embedded JavaScript syntax
        run: npm run test:syntax
      - name: Build Android web assets
        run: npm run build:android-web
      - name: Test Firestore rules in emulator
        run: npm run test:rules
